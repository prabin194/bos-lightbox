<!DOCTYPE html>

<head>

<title>404 — bos-lightbox</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fcfbf9;--surface:#f6f5f1;--surface2:#eae8e3;--border:#e0ddd6;--text:#1a1814;--text2:#5c5953;--text3:#8c8880;--accent:#2d3748;--radius:10px;font-family:Outfit,system-ui,-apple-system,sans-serif;font-size:15.5px;line-height:1.65;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.dark{--bg:#141312;--surface:#1c1a18;--surface2:#262320;--border:#33302c;--text:#e8e4de;--text2:#9a9590;--text3:#6e6a65}
html{scroll-behavior:smooth;height:100%}body{display:flex;flex-direction:column;min-height:100%}
header{position:sticky;top:0;z-index:100;background:rgba(252,251,249,0.85);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--border)}
.dark header{background:rgba(20,19,18,0.85)}
.header-inner{max-width:1100px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px;gap:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;color:var(--text);text-decoration:none;margin-right:auto;letter-spacing:-0.01em}
.logo svg{width:22px;height:22px;flex-shrink:0}.dark .logo svg{stroke:#a08972}
nav{display:flex;align-items:center;gap:2px}
nav a{padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text2);text-decoration:none;transition:color 0.2s,background 0.2s}
nav a:hover{color:var(--text);background:var(--surface2)}
.nav-btns{display:flex;align-items:center;gap:4px;margin-left:8px}
.nav-btn{width:34px;height:34px;border:none;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:color 0.2s,background 0.2s}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
main{flex:1}.wrapper{max-width:600px;margin:0 auto;padding:0 28px;width:100%}
.error-wrap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem 0}
.error-code{font-size:clamp(3.5rem,10vw,6rem);font-weight:700;letter-spacing:-0.04em;line-height:1;color:var(--text);margin-bottom:0.25rem}
.error-title{font-size:1.2rem;font-weight:600;margin-bottom:0.5rem;color:var(--text)}
.error-desc{font-size:14px;color:var(--text2);margin-bottom:1.5rem;max-width:380px;margin-left:auto;margin-right:auto;line-height:1.55}
.error-links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.error-links a{display:inline-flex;align-items:center;gap:6px;padding:7px 18px;border-radius:999px;font-size:13px;font-weight:500;transition:all 0.15s;text-decoration:none}
.error-links .primary{background:var(--text);color:var(--bg)}
.error-links .primary:hover{opacity:0.85}
.error-links .secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.error-links .secondary:hover{background:var(--surface2)}
footer{text-align:center;padding:28px 24px;border-top:1px solid var(--border);font-size:13px;color:var(--text3)}
footer a{color:var(--text);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--border)}
@media(max-width:640px){nav{display:none}.wrapper{padding:0 16px}}
</style>
</head>
<body>
<header>
<div class="header-inner">
<a href="./" class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>bos-lightbox</a>
<nav>

</nav>
<div class="nav-btns">
<button class="nav-btn" id="theme-btn" aria-label="Toggle theme">🌙</button>
</div>
</div>
</header>
<main class="error-wrap"><div class="wrapper">
<div class="error-code">404</div>
<div class="error-title">Page not found</div>
<p class="error-desc">The page you're looking for doesn't exist or has been moved.</p>
<div class="error-links">
<a href="index.html" class="primary">Home</a>
<a href="documentation.html" class="secondary">Docs</a>
<a href="roadmap.html" class="secondary">Roadmap</a>
</div>
</div></main>
<footer>
<p>bos-lightbox &mdash; MIT &copy; Prabin Paudel &bull; <a href="https://github.com/prabin194/bos-lightbox">GitHub</a></p>
</footer>
<script>
(function(){var b=document.getElementById('theme-btn'),d=document.documentElement;if(b){var t=localStorage.getItem('theme');if(t==='dark'){d.classList.add('dark');b.textContent='☀️'}b.addEventListener('click',function(){d.classList.toggle('dark');var isDark=d.classList.contains('dark');localStorage.setItem('theme',isDark?'dark':'light');b.textContent=isDark?'☀️':'🌙'})}})();
</script>
</body>
</html>

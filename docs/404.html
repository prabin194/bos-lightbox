<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 — bos-lightbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--surface:#f8f9fa;--surface2:#f1f3f5;--border:#e2e4e8;--text:#0f1117;--text2:#525866;--text3:#868c98;--accent:#7c3aed;--accent2:#a78bfa;--radius:10px;font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.7;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.dark{--bg:#0b0d10;--surface:#121418;--surface2:#1a1d24;--border:#262a32;--text:#edf0f5;--text2:#9498a3;--text3:#636873}
html{scroll-behavior:smooth;height:100%}body{display:flex;flex-direction:column;min-height:100%}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.8);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--border)}
.dark header{background:rgba(11,13,16,0.8)}
.header-inner{max-width:1100px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px;gap:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--text);text-decoration:none;margin-right:auto;letter-spacing:-0.02em}
.logo svg{width:22px;height:22px;flex-shrink:0}
nav{display:flex;align-items:center;gap:2px}
nav a{padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text2);text-decoration:none;transition:color 0.15s,background 0.15s}
nav a:hover{color:var(--text);background:var(--surface2)}
nav a.active{color:var(--accent);background:rgba(124,58,237,0.08)}
.dark nav a.active{background:rgba(124,58,237,0.15)}
.nav-btns{display:flex;align-items:center;gap:4px;margin-left:8px}
.nav-btn{width:34px;height:34px;border:none;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:color 0.15s,background 0.15s}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
main{flex:1}.wrapper{max-width:600px;margin:0 auto;padding:0 28px;width:100%}

.error-wrap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:3rem 0}
.error-code{font-size:clamp(5rem,14vw,8rem);font-weight:800;letter-spacing:-0.04em;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.5rem}
.error-title{font-size:1.4rem;font-weight:600;margin-bottom:0.75rem;color:var(--text)}
.error-desc{font-size:15px;color:var(--text2);margin-bottom:2rem;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.6}
.error-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.error-links a{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:8px;font-size:13.5px;font-weight:500;transition:all 0.15s;text-decoration:none}
.error-links .primary{background:var(--accent);color:#fff}
.error-links .primary:hover{filter:brightness(1.1)}
.error-links .secondary{border:1px solid var(--border);color:var(--text)}
.error-links .secondary:hover{background:var(--surface2)}

footer{text-align:center;padding:32px 24px;border-top:1px solid var(--border);font-size:13px;color:var(--text3)}
footer a{color:var(--accent);text-decoration:none}

@media(max-width:640px){
  nav{display:none}
  .wrapper{padding:0 16px}
}
</style>
</head>
<body>
<header>
<div class="header-inner">
<a href="./" class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="%237c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>bos-lightbox</a>
<nav>
<a href="./">Home</a>
<a href="documentation.html">Docs</a>
<a href="roadmap.html">Roadmap</a>
<a href="changelogs.html">Changelogs</a>
<a href="https://github.com/prabin194/bos-lightbox" target="_blank">GitHub</a>
</nav>
<div class="nav-btns">
<button class="nav-btn" id="theme-btn" aria-label="Toggle theme">🌙</button>
</div>
</div>
</header>
<main class="error-wrap"><div class="wrapper">
<div class="error-code">404</div>
<div class="error-title">Page not found</div>
<p class="error-desc">The page you are looking for does not exist or has been moved.</p>
<div class="error-links">
<a href="index.html" class="primary">🏠 Home</a>
<a href="documentation.html" class="secondary">📖 Docs</a>
<a href="roadmap.html" class="secondary">🗺️ Roadmap</a>
<a href="changelogs.html" class="secondary">📋 Changelog</a>
</div>
</div></main>
<footer>
<p>bos-lightbox &mdash; MIT &copy; Prabin Paudel &bull; <a href="https://github.com/prabin194/bos-lightbox">GitHub</a></p>
</footer>
<script>
(function(){var b=document.getElementById('theme-btn'),d=document.documentElement;if(b){var t=localStorage.getItem('theme');if(t==='dark'){d.classList.add('dark');b.textContent='☀️'}b.addEventListener('click',function(){d.classList.toggle('dark');var isDark=d.classList.contains('dark');localStorage.setItem('theme',isDark?'dark':'light');b.textContent=isDark?'☀️':'🌙'})}})();
</script>
</body>
</html>

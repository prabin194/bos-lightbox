<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#2c1b4d"/>
      <stop offset="80%" stop-color="#e85d3a"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3561"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b3863"/>
      <stop offset="100%" stop-color="#1f1c3a"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowsoft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.5" opacity="0.8"/>
    <circle cx="150" cy="70" r="1" opacity="0.5"/>
    <circle cx="280" cy="25" r="1.2" opacity="0.7"/>
    <circle cx="420" cy="50" r="1" opacity="0.4"/>
    <circle cx="530" cy="35" r="1.5" opacity="0.6"/>
    <circle cx="680" cy="60" r="1" opacity="0.5"/>
    <circle cx="750" cy="30" r="1.3" opacity="0.7"/>
    <circle cx="100" cy="100" r="0.8" opacity="0.3"/>
    <circle cx="350" cy="80" r="0.8" opacity="0.4"/>
    <circle cx="600" cy="90" r="1" opacity="0.3"/>
  </g>

  <!-- Moon -->
  <circle cx="650" cy="80" r="30" fill="#f5e6cc" opacity="0.85" filter="url(#glow2)"/>

  <!-- Background buildings (darker) -->
  <rect x="0" y="300" width="45" height="300" fill="#12102a"/>
  <rect x="50" y="260" width="35" height="340" fill="#151330"/>
  <rect x="90" y="280" width="50" height="320" fill="#12102a"/>
  <rect x="145" y="240" width="40" height="360" fill="#14122e"/>
  <rect x="190" y="270" width="55" height="330" fill="#12102a"/>
  <rect x="250" y="220" width="45" height="380" fill="#13112c"/>
  <rect x="300" y="200" width="60" height="400" fill="#14122e"/>
  <rect x="365" y="250" width="40" height="350" fill="#12102a"/>
  <rect x="410" y="230" width="50" height="370" fill="#13112c"/>
  <rect x="465" y="280" width="35" height="320" fill="#12102a"/>
  <rect x="505" y="210" width="55" height="390" fill="#14122e"/>
  <rect x="565" y="260" width="40" height="340" fill="#12102a"/>
  <rect x="610" y="240" width="50" height="360" fill="#13112c"/>
  <rect x="665" y="270" width="35" height="330" fill="#12102a"/>
  <rect x="705" y="230" width="45" height="370" fill="#14122e"/>
  <rect x="755" y="260" width="45" height="340" fill="#12102a"/>

  <!-- Windows (lit) -->
  <g fill="#f5a623" opacity="0.6">
    <!-- Building at 250 -->
    <rect x="260" y="240" width="6" height="4"/>
    <rect x="272" y="240" width="6" height="4"/>
    <rect x="260" y="260" width="6" height="4"/>
    <rect x="272" y="260" width="6" height="4"/>
    <rect x="260" y="280" width="6" height="4"/>
    <rect x="272" y="280" width="6" height="4"/>
    <rect x="260" y="340" width="6" height="4"/>
    <rect x="272" y="340" width="6" height="4"/>

    <!-- Building at 300 -->
    <rect x="310" y="220" width="8" height="5"/>
    <rect x="325" y="220" width="8" height="5"/>
    <rect x="340" y="220" width="8" height="5"/>
    <rect x="310" y="240" width="8" height="5"/>
    <rect x="325" y="240" width="8" height="5"/>
    <rect x="340" y="240" width="8" height="5"/>
    <rect x="310" y="300" width="8" height="5"/>
    <rect x="325" y="300" width="8" height="5"/>
    <rect x="310" y="370" width="8" height="5"/>
    <rect x="325" y="370" width="8" height="5"/>

    <!-- Building at 410 -->
    <rect x="420" y="250" width="6" height="4"/>
    <rect x="432" y="250" width="6" height="4"/>
    <rect x="420" y="270" width="6" height="4"/>
    <rect x="420" y="330" width="6" height="4"/>
    <rect x="432" y="330" width="6" height="4"/>

    <!-- Building at 505 -->
    <rect x="515" y="230" width="7" height="4"/>
    <rect x="528" y="230" width="7" height="4"/>
    <rect x="541" y="230" width="7" height="4"/>
    <rect x="515" y="250" width="7" height="4"/>
    <rect x="528" y="250" width="7" height="4"/>
    <rect x="515" y="310" width="7" height="4"/>
    <rect x="528" y="310" width="7" height="4"/>
    <rect x="541" y="310" width="7" height="4"/>

    <!-- Scattered warm windows -->
    <rect x="100" y="300" width="5" height="3"/>
    <rect x="155" y="260" width="5" height="3"/>
    <rect x="167" y="260" width="5" height="3"/>
    <rect x="200" y="290" width="5" height="3"/>
    <rect x="375" y="270" width="5" height="3"/>
    <rect x="475" y="300" width="5" height="3"/>
    <rect x="575" y="280" width="5" height="3"/>
    <rect x="620" y="260" width="5" height="3"/>
    <rect x="632" y="260" width="5" height="3"/>
    <rect x="715" y="250" width="5" height="3"/>
    <rect x="765" y="280" width="5" height="3"/>
  </g>

  <!-- Some blue/cool windows -->
  <g fill="#00cec9" opacity="0.4">
    <rect x="310" y="260" width="8" height="5"/>
    <rect x="340" y="260" width="8" height="5"/>
    <rect x="420" y="290" width="6" height="4"/>
    <rect x="432" y="290" width="6" height="4"/>
    <rect x="528" y="270" width="7" height="4"/>
    <rect x="515" y="270" width="7" height="4"/>
  </g>

  <!-- Sun glow near horizon -->
  <ellipse cx="400" cy="520" rx="300" ry="80" fill="#f5a623" opacity="0.08" filter="url(#glowsoft)"/>
  <ellipse cx="400" cy="530" rx="200" ry="50" fill="#e85d3a" opacity="0.06" filter="url(#glowsoft)"/>

  <!-- Ground -->
  <rect x="0" y="560" width="800" height="40" fill="#0a0818"/>
</svg>
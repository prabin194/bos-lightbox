<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0984e3"/>
      <stop offset="100%" stop-color="#0652DD"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#e17055"/>
    </linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#006266"/>
    </linearGradient>
    <linearGradient id="r5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="r6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fd79a8"/>
      <stop offset="100%" stop-color="#e84393"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="0"/>
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="0" x2="0" y2="600"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
  </g>

  <!-- Large rectangle row 1 -->
  <rect x="50" y="50" width="160" height="100" rx="4" fill="url(#r1)" opacity="0.85"/>
  <rect x="260" y="50" width="280" height="100" rx="4" fill="url(#r2)" opacity="0.75"/>
  <rect x="590" y="50" width="160" height="100" rx="4" fill="url(#r3)" opacity="0.8"/>

  <!-- Row 2 - circles -->
  <circle cx="130" cy="250" r="60" fill="url(#r4)" opacity="0.8"/>
  <circle cx="400" cy="250" r="80" fill="url(#r5)" opacity="0.75"/>
  <circle cx="670" cy="250" r="55" fill="url(#r6)" opacity="0.8"/>

  <!-- Row 3 - triangles -->
  <polygon points="100,430 50,530 150,530" fill="url(#r3)" opacity="0.7"/>
  <polygon points="230,410 180,530 280,530" fill="url(#r1)" opacity="0.65"/>
  <polygon points="370,440 310,530 430,530" fill="url(#r4)" opacity="0.7"/>
  <polygon points="530,420 480,530 580,530" fill="url(#r2)" opacity="0.65"/>
  <polygon points="680,450 630,530 730,530" fill="url(#r6)" opacity="0.7"/>

  <!-- Row 4 - small squares -->
  <rect x="40" y="440" width="30" height="30" fill="#ff6b6b" opacity="0.5"/>
  <rect x="110" y="460" width="20" height="20" fill="#0984e3" opacity="0.5"/>
  <rect x="180" y="445" width="25" height="25" fill="#fdcb6e" opacity="0.5"/>
  <rect x="260" y="470" width="22" height="22" fill="#00cec9" opacity="0.5"/>
  <rect x="330" y="450" width="28" height="28" fill="#a29bfe" opacity="0.5"/>
  <rect x="410" y="465" width="20" height="20" fill="#fd79a8" opacity="0.5"/>
  <rect x="480" y="440" width="26" height="26" fill="#ff6b6b" opacity="0.5"/>
  <rect x="560" y="460" width="22" height="22" fill="#0984e3" opacity="0.5"/>
  <rect x="640" y="445" width="24" height="24" fill="#fdcb6e" opacity="0.5"/>
  <rect x="720" y="465" width="20" height="20" fill="#00cec9" opacity="0.5"/>

  <!-- Decorative connecting lines -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="130" y1="310" x2="400" y2="330"/>
    <line x1="400" y1="330" x2="670" y2="305"/>
    <line x1="130" y1="150" x2="130" y2="190"/>
    <line x1="400" y1="150" x2="400" y2="170"/>
    <line x1="670" y1="150" x2="670" y2="195"/>
  </g>

  <!-- Corner accents -->
  <path d="M15,15 L40,15 M15,15 L15,40" stroke="#ff6b6b" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M785,15 L760,15 M785,15 L785,40" stroke="#0984e3" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M15,585 L40,585 M15,585 L15,560" stroke="#fdcb6e" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M785,585 L760,585 M785,585 L785,560" stroke="#00cec9" stroke-width="2" fill="none" opacity="0.5"/>
</svg>